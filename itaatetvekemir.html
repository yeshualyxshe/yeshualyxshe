<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>İtaat et ve Kemir</title>

    <!-- Google AdSense -->
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7304771774737870"
        crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* SOL REKLAM */
        .side-ad {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 300px;
            z-index: 5;
            overflow: hidden;
        }

        .left-ad {
            left: 10px;
        }

        .right-ad {
            right: 10px;
        }

        /* KİTAP ALANI */
        .book-container {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 150px;
            box-sizing: border-box;
        }

        /* PDF GÖRÜNÜMÜ */
        iframe {
            width: min(70vw, 900px);
            height: 95vh;
            border: none;
            background: white;
        }

        /* REKLAMIN PDF'YE TAŞMAMASI */
        .side-ad .adsbygoogle {
            display: block;
            width: 120px;
            height: 300px;
            max-width: 120px;
            overflow: hidden;
        }

        /* MOBİL */
        @media (max-width: 800px) {

            .side-ad {
                display: none;
            }

            .book-container {
                padding: 10px;
            }

            iframe {
                width: 100%;
                height: 95vh;
            }
        }
    </style>
</head>

<body>

    <!-- SOL REKLAM -->
    <div class="side-ad left-ad">
        <ins class="adsbygoogle"
             data-ad-client="ca-pub-7304771774737870"
             data-ad-slot="4054033259"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>

        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>


    <!-- SAĞ REKLAM -->
    <div class="side-ad right-ad">
        <ins class="adsbygoogle"
             data-ad-client="ca-pub-7304771774737870"
             data-ad-slot="4054033259"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>

        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>


    <!-- KİTAP -->
    <div class="book-container">
        <iframe src="itaatetvekemir.pdf"></iframe>
    </div>

</body>
</html>
