<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kan ve Gümüş</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .side-ad {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 300px;
            background: #222;
            color: #777;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .left-ad {
            left: 10px;
        }

        .right-ad {
            right: 10px;
        }

        .book-container {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 150px;
            box-sizing: border-box;
        }

        iframe {
            width: min(70vw, 900px);
            height: 95vh;
            border: none;
            background: white;
        }

        @media (max-width: 800px) {
            .side-ad {
                display: none;
            }

            .book-container {
                padding: 10px;
            }

            iframe {
                width: 100%;
                height: 95vh;
            }
        }
    </style>
</head>

<body>

    <div class="side-ad left-ad">
        Advertisement
    </div>

    <div class="side-ad right-ad">
        Advertisement
    </div>

    <div class="book-container">
        <iframe src="kanvegumus.pdf"></iframe>
    </div>

</body>
</html>
