<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Books</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .ad {
            background: #222;
            color: #888;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px;
        }

        .top-ad,
        .bottom-ad {
            width: calc(100% - 20px);
        }

        .page {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            max-width: 1400px;
            margin: auto;
        }

        .side-ad {
            width: 160px;
            min-height: 600px;
            flex-shrink: 0;
        }

        .books {
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .book {
            width: 280px;
            text-decoration: none;
            color: white;
        }

        .book img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 5px;
            transition: transform 0.2s;
        }

        .book img:hover {
            transform: scale(1.03);
        }

        .book h2 {
            margin-top: 15px;
        }

        footer {
            padding: 30px 10px;
            color: #aaa;
            font-size: 14px;
        }

        @media (max-width: 900px) {
            .side-ad {
                display: none;
            }

            .books {
                gap: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="ad top-ad">
        TOP AD
    </div>

    <div class="page">

        <div class="ad side-ad">
            LEFT AD
        </div>

        <main>
            <h1>My Books</h1>

            <div class="books">

                <a class="book" href="kan-ve-gumus.html">
                    <img src="KapakKVG.png" alt="Kan ve Gümüş">
                    <h2>Kan ve Gümüş</h2>
                </a>

                <a class="book" href="itaat-et-ve-kemir.html">
                    <img src="KapakIVK.png" alt="İtaat et ve kemir">
                    <h2>İtaat et ve kemir</h2>
                </a>

            </div>
        </main>

        <div class="ad side-ad">
            RIGHT AD
        </div>

    </div>

    <div class="ad bottom-ad">
        BOTTOM AD
    </div>

    <footer>
        For English users, we recommend a real-time translator application to read these books
    </footer>

</body>
</html>
