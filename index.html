<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeshua Lyxshe</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .top-ad,
        .bottom-ad {
            height: 90px;
            margin: 20px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        .side-ad {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 300px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        .left-ad {
            left: 10px;
        }

        .right-ad {
            right: 10px;
        }

        .books {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 40px auto;
            max-width: 900px;
        }

        .book {
            width: 350px;
        }

        .book img {
            width: 100%;
            aspect-ratio: 1 / 1.414;
            object-fit: cover;
            display: block;
            border-radius: 5px;
        }

        .book h2 {
            margin-top: 15px;
            font-size: 24px;
        }

        .book a {
            color: white;
            text-decoration: none;
        }

        footer {
            margin: 40px 20px 20px;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .side-ad {
                display: none;
            }

            .books {
                flex-direction: column;
                align-items: center;
            }

            .book {
                width: 80%;
                max-width: 350px;
            }
        }
    </style>
</head>

<body>

    <div class="top-ad">
        Advertisement
    </div>

    <div class="side-ad left-ad">
        Advertisement
    </div>

    <div class="side-ad right-ad">
        Advertisement
    </div>

    <h1>Yeshua Lyxshe</h1>

    <div class="books">

        <!-- İtaat et ve Kemir - SOL -->
        <div class="book">
            <a href="itaat-et-ve-kemir.html">
                <img src="KapakIVK.png" alt="İtaat et ve Kemir">
                <h2>İtaat et ve Kemir</h2>
            </a>
        </div>

        <!-- Kan ve Gümüş - SAĞ -->
        <div class="book">
            <a href="kan-ve-gumus.html">
                <img src="KapakKVG.png" alt="Kan ve Gümüş">
                <h2>Kan ve Gümüş</h2>
            </a>
        </div>

    </div>

    <footer>
        For English users, we recommend a real-time translator application to read these books
    </footer>

    <div class="bottom-ad">
        Advertisement
    </div>

</body>
</html>
